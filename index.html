<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Product Scanner</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    /* ... (keep all existing styles) ... */
    
    .scanner-container {
      /* Add this for better focus guidance */
      background: rgba(0, 0, 0, 0.9);
    }
    
    .scanner-frame {
      /* Make scanning area more prominent */
      border: 4px solid #00ff88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }
    
    .scan-line {
      /* More visible scan line */
      height: 4px;
      background: linear-gradient(90deg, transparent, #00ff88, transparent);
      box-shadow: 0 0 10px #00ff88;
    }
    
    #scanner-feedback {
      /* More prominent feedback */
      background: rgba(0, 0, 0, 0.8);
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 20px;
      left: 50%;
      transform: translateX(-50%);
      top: 20px;
    }
    
    .scanner-performance {
      /* Better performance indicator */
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 15px;
      border-radius: 20px;
      top: 20px;
      right: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ProductScan</div>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search products...">
      <div id="search-results"></div>
    </div>
    <button class="menu-btn" id="menu-btn">☰</button>
  </header>
  
  <div class="container">
    <div class="main-content">
      <button id="scan-btn" class="btn btn-secondary">📷 Scan Barcode</button>
      <button id="sync-btn" class="btn">🔄 Sync Now</button>
      
      <div class="scanner-container" id="scanner-container">
        <div class="scanner-feedback" id="scanner-feedback">Scanning...</div>
        <div class="scanner-performance" id="scanner-performance">FPS: 0 | Quality: High</div>
        <video id="scanner-video" playsinline autoplay></video>
        <div class="scanner-overlay">
          <div class="scanner-frame">
            <div class="scan-line"></div>
          </div>
          <div class="scanner-guide">Point camera at barcode</div>
        </div>
        <div class="scanner-controls">
          <button class="scanner-btn" id="close-scanner">✕</button>
        </div>
      </div>
      
      <div class="product-display" id="product-display">
        <div class="product-name" id="product-name"></div>
        <div class="product-price" id="product-price"></div>
        <div class="product-barcode" id="product-barcode"></div>
      </div>
      
      <div class="not-found" id="not-found">
        Product not found in database
      </div>
      
      <div class="sync-status" id="sync-status">
        Last sync: Never
      </div>
    </div>
  </div>
  
  <div class="debug-panel-container">
    <button class="debug-toggle" id="debug-toggle">Debug Mode</button>
    <div class="debug-panel" id="debug-panel">
      <div class="debug-header">
        <div class="debug-title">Debug Information</div>
        <button class="debug-clear" id="debug-clear">Clear</button>
      </div>
      <div class="debug-info" id="debug-info"></div>
    </div>
  </div>
  
  <div class="offline-banner" id="offline-banner">
    You are currently offline. Some features may be limited.
  </div>
  
  <div class="modal" id="login-modal">
    <div class="modal-content">
      <div class="modal-title">Admin Login</div>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Password">
      </div>
      <div class="error-message" id="login-error"></div>
      <div class="modal-actions">
        <button id="cancel-login" class="btn btn-danger" style="margin-right: 10px;">Cancel</button>
        <button id="submit-login" class="btn">Login</button>
      </div>
    </div>
  </div>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDdjJKO4eeIWtKKUKiuT9USPF3eyFnVuSQ",
      authDomain: "scan-prod1.firebaseapp.com",
      databaseURL: "https://scan-prod1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "scan-prod1",
      storageBucket: "scan-prod1.firebasestorage.app",
      messagingSenderId: "197976973628",
      appId: "1:197976973628:web:73bdf954ae78017b813e39"
    };
    
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    
    // DOM elements
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const menuBtn = document.getElementById('menu-btn');
    const scanBtn = document.getElementById('scan-btn');
    const syncBtn = document.getElementById('sync-btn');
    const scannerContainer = document.getElementById('scanner-container');
    const scannerVideo = document.getElementById('scanner-video');
    const scannerFeedback = document.getElementById('scanner-feedback');
    const scannerPerformance = document.getElementById('scanner-performance');
    const closeScanner = document.getElementById('close-scanner');
    const productDisplay = document.getElementById('product-display');
    const productName = document.getElementById('product-name');
    const productPrice = document.getElementById('product-price');
    const productBarcode = document.getElementById('product-barcode');
    const notFound = document.getElementById('not-found');
    const syncStatus = document.getElementById('sync-status');
    const offlineBanner = document.getElementById('offline-banner');
    const loginModal = document.getElementById('login-modal');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginError = document.getElementById('login-error');
    const cancelLogin = document.getElementById('cancel-login');
    const submitLogin = document.getElementById('submit-login');
    const debugToggle = document.getElementById('debug-toggle');
    const debugPanel = document.getElementById('debug-panel');
    const debugInfo = document.getElementById('debug-info');
    const debugClear = document.getElementById('debug-clear');
    
    // Variables
    let isScanning = false;
    let scannerInterval = null;
    let canvasContext = null;
    let db = null;
    let stream = null;
    let debugMode = true;
    let debugPanelVisible = false;
    let scanAttempts = 0;
    let lastScannedBarcode = null;
    let lastFrameTime = 0;
    let frameCount = 0;
    let fps = 0;
    let fpsInterval = 0;
    let lastScanTime = 0;

    // Initialize IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('ProductDB', 4); // Increased version to force update
        
        request.onerror = (event) => {
          console.error('IndexedDB error:', event.target.error);
          showDebug('IndexedDB error: ' + event.target.error.message);
          reject('Failed to open database');
        };
        
        request.onsuccess = (event) => {
          db = event.target.result;
          showDebug('IndexedDB initialized successfully');
          resolve(db);
        };
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('products')) {
            const store = db.createObjectStore('products', { keyPath: 'barcode' });
            store.createIndex('name', 'name', { unique: false });
            showDebug('Created products object store');
          }
        };
      });
    }
    
    // Add product to IndexedDB
    function addProductToDB(product) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readwrite');
        const store = transaction.objectStore('products');
        const request = store.put(product);
        
        request.onsuccess = () => {
          showDebug(`Added product to IndexedDB: ${product.barcode} - ${product.name}`);
          resolve();
        }
        request.onerror = (event) => {
          showDebug('Error adding product to IndexedDB: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Get product by barcode from IndexedDB
    function getProductByBarcode(barcode) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const request = store.get(barcode);
        
        request.onsuccess = () => {
          showDebug(`Product lookup for ${barcode}: ${request.result ? 'Found' : 'Not found'}`);
          resolve(request.result);
        }
        request.onerror = (event) => {
          showDebug('Error getting product from IndexedDB: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Search products by name in IndexedDB
    function searchProductsByName(query) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const index = store.index('name');
        const request = index.getAll();
        
        request.onsuccess = () => {
          const products = request.result.filter(product => 
            product.name.toLowerCase().includes(query.toLowerCase())
          );
          showDebug(`Search for "${query}" found ${products.length} products`);
          resolve(products);
        };
        
        request.onerror = (event) => {
          showDebug('Search error: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Get all products from IndexedDB
    function getAllProductsFromDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const request = store.getAll();
        
        request.onsuccess = () => {
          showDebug(`Retrieved ${request.result.length} products from IndexedDB`);
          resolve(request.result);
        };
        request.onerror = (event) => {
          showDebug('Error getting all products: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Clear all products from IndexedDB
    function clearProductsDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readwrite');
        const store = transaction.objectStore('products');
        const request = store.clear();
        
        request.onsuccess = () => {
          showDebug('Cleared all products from IndexedDB');
          resolve();
        }
        request.onerror = (event) => {
          showDebug('Error clearing IndexedDB: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Sync products from Firebase to IndexedDB
    async function syncProducts() {
      try {
        if (!navigator.onLine) {
          showDebug('Sync failed: No internet connection');
          throw new Error('No internet connection');
        }
        
        syncBtn.innerHTML = '<span class="loading"></span> Syncing...';
        showDebug('Starting product sync from Firebase');
        
        const snapshot = await database.ref('products').once('value');
        const products = snapshot.val();
        
        await clearProductsDB();
        
        if (products) {
          const productCount = Object.keys(products).length;
          showDebug(`Syncing ${productCount} products from Firebase`);
          
          const promises = Object.entries(products).map(([barcode, product]) => {
            // Ensure barcode is stored as string for consistency
            const productData = {
              ...product,
              barcode: String(barcode) // Use Firebase key as barcode
            };
            return addProductToDB(productData);
          });
          
          await Promise.all(promises);
          showDebug(`Successfully synced ${productCount} products`);
        } else {
          showDebug('No products found in Firebase');
        }
        
        const lastSync = new Date().toLocaleString();
        localStorage.setItem('lastSync', lastSync);
        syncStatus.textContent = `Last sync: ${lastSync}`;
        syncBtn.textContent = '🔄 Sync Now';
        showDebug('Sync completed successfully');
        
        return true;
      } catch (error) {
        console.error('Sync failed:', error);
        showDebug('Sync failed: ' + error.message);
        syncBtn.textContent = '🔄 Sync Now';
        showError('Sync failed. ' + error.message);
        return false;
      }
    }
    
    // Show product information
    function showProduct(product) {
      productName.textContent = product.name;
      productPrice.textContent = `$${product.price.toFixed(2)}`;
      productBarcode.textContent = `Barcode: ${product.barcode}`;
      productDisplay.style.display = 'block';
      notFound.style.display = 'none';
      showDebug(`Displaying product: ${product.barcode} - ${product.name}`);
    }
    
    // Show not found message
    function showNotFound() {
      productDisplay.style.display = 'none';
      notFound.style.display = 'block';
      showDebug('Product not found in database');
    }
    
    // Show error message
    function showError(message) {
      const errorElement = document.createElement('div');
      errorElement.className = 'error-message';
      errorElement.textContent = message;
      
      const container = document.querySelector('.container');
      container.insertBefore(errorElement, container.firstChild);
      
      setTimeout(() => {
        errorElement.remove();
      }, 5000);
    }
    
    // Show debug information
    function showDebug(message) {
      if (!debugMode) return;
      
      const now = new Date();
      const timestamp = now.toLocaleTimeString() + '.' + now.getMilliseconds().toString().padStart(3, '0');
      
      const debugEntry = document.createElement('div');
      debugEntry.className = 'debug-entry';
      debugEntry.innerHTML = `
        <span class="debug-timestamp">[${timestamp}]</span>
        <span class="debug-message">${message}</span>
      `;
      
      debugInfo.appendChild(debugEntry);
      debugInfo.scrollTop = debugInfo.scrollHeight;
    }
    
    // Toggle debug panel
    function toggleDebugPanel() {
      debugPanelVisible = !debugPanelVisible;
      debugPanel.style.display = debugPanelVisible ? 'block' : 'none';
    }
    
    // Initialize barcode scanner with MAX quality
    async function initScanner() {
      try {
        // Create canvas for processing
        const canvas = document.createElement('canvas');
        canvasContext = canvas.getContext('2d', { willReadFrequently: true });
        
        // Get camera access with MAXIMUM quality settings
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "environment", // Prefer back camera
            width: { ideal: 4096 },    // Max resolution
            height: { ideal: 2160 },   // Max resolution
            frameRate: { ideal: 60, max: 60 }, // Max frame rate
            focusMode: "continuous"    // Continuous autofocus
          } 
        });
        
        scannerVideo.srcObject = stream;
        scannerContainer.style.display = 'flex';
        scannerFeedback.style.display = 'block';
        scannerPerformance.style.display = 'block';
        isScanning = true;
        scanAttempts = 0;
        lastFrameTime = performance.now();
        frameCount = 0;
        fps = 0;
        fpsInterval = setInterval(() => {
          fps = frameCount;
          frameCount = 0;
          scannerPerformance.textContent = `FPS: ${fps} | Quality: High`;
        }, 1000);
        showDebug('Scanner initialized with MAX quality settings');
        
        // Apply the correct orientation for back camera
        scannerVideo.style.transform = 'scaleX(1)';
        
        // Start scanning when video is playing
        scannerVideo.onplaying = () => {
          showDebug('Video stream started with high quality');
          
          // Set canvas dimensions to match video
          canvas.width = scannerVideo.videoWidth;
          canvas.height = scannerVideo.videoHeight;
          showDebug(`Canvas size: ${canvas.width}x${canvas.height}`);
          
          // Start scanning
          scannerInterval = setInterval(() => {
            scanBarcode(canvas);
          }, 16); // ~60 FPS scanning
        };
        
      } catch (error) {
        console.error('Scanner init failed:', error);
        showDebug('Scanner init failed: ' + error.message);
        
        // Fallback to lower quality settings if max fails
        if (error.name === 'OverconstrainedError') {
          showDebug('Trying fallback camera settings');
          initScannerFallback();
        } else {
          showError('Failed to initialize scanner: ' + error.message);
          if (error.name === 'NotAllowedError') {
            showError('Camera access denied. Please allow camera permissions.');
          }
          stopScanner();
        }
      }
    }
    
    // Fallback scanner with reduced quality
    async function initScannerFallback() {
      try {
        // Create canvas for processing
        const canvas = document.createElement('canvas');
        canvasContext = canvas.getContext('2d', { willReadFrequently: true });
        
        // Get camera access with high but not max settings
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60 },
            focusMode: "continuous"
          } 
        });
        
        scannerVideo.srcObject = stream;
        scannerContainer.style.display = 'flex';
        scannerFeedback.style.display = 'block';
        scannerPerformance.style.display = 'block';
        isScanning = true;
        scanAttempts = 0;
        lastFrameTime = performance.now();
        frameCount = 0;
        fpsInterval = setInterval(() => {
          fps = frameCount;
          frameCount = 0;
          scannerPerformance.textContent = `FPS: ${fps} | Quality: Medium`;
        }, 1000);
        showDebug('Scanner initialized with fallback settings');
        
        // Apply the correct orientation for back camera
        scannerVideo.style.transform = 'scaleX(1)';
        
        // Start scanning when video is playing
        scannerVideo.onplaying = () => {
          showDebug('Video stream started with fallback settings');
          
          // Set canvas dimensions to match video
          canvas.width = scannerVideo.videoWidth;
          canvas.height = scannerVideo.videoHeight;
          showDebug(`Canvas size: ${canvas.width}x${canvas.height}`);
          
          // Start scanning
          scannerInterval = setInterval(() => {
            scanBarcode(canvas);
          }, 16); // ~60 FPS scanning
        };
        
      } catch (error) {
        console.error('Fallback scanner init failed:', error);
        showDebug('Fallback scanner init failed: ' + error.message);
        showError('Failed to initialize scanner: ' + error.message);
        stopScanner();
      }
    }
    
    // Enhanced barcode scanning algorithm
    function scanBarcode(canvas) {
      if (!scannerVideo.videoWidth || !scannerVideo.videoHeight) {
        return;
      }
      
      const now = performance.now();
      if (now - lastScanTime < 16) { // Only scan at 60fps
        return;
      }
      
      lastScanTime = now;
      scanAttempts++;
      frameCount++;
      
      try {
        // Draw video frame to canvas
        canvasContext.drawImage(
          scannerVideo, 
          0, 
          0, 
          canvas.width, 
          canvas.height
        );
        
        // Get image data
        const imageData = canvasContext.getImageData(
          0, 
          0, 
          canvas.width, 
          canvas.height
        );
        
        // Scan for QR/barcode
        const code = jsQR(
          imageData.data, 
          imageData.width, 
          imageData.height, 
          {
            inversionAttempts: "dontInvert",
            canOverwriteImage: false
          }
        );
        
        // If code found
        if (code) {
          showDebug(`Scanned barcode (attempt #${scanAttempts}): ${code.data}`);
          
          // Enhanced barcode validation
          const barcode = code.data;
          const isValid = validateBarcode(barcode);
          
          if (isValid) {
            showDebug('Valid barcode detected');
            lastScannedBarcode = barcode;
            handleBarcodeScan(barcode);
          } else {
            showDebug('Invalid barcode format');
          }
        }
      } catch (error) {
        console.error('Scan error:', error);
        showDebug('Scan error: ' + error.message);
      }
      
      // Show scanning status
      scannerFeedback.textContent = `Scanning... (Attempt ${scanAttempts})`;
    }
    
    // Enhanced barcode validation
    function validateBarcode(barcode) {
      // Check for common barcode formats
      const patterns = [
        /^\d{8}$/,     // EAN-8
        /^\d{12,13}$/, // UPC-A, UPC-E, EAN-13
        /^\d{14}$/     // GTIN-14
      ];
      
      return patterns.some(pattern => pattern.test(barcode));
    }
    
    // Stop barcode scanner
    function stopScanner() {
      if (scannerInterval) {
        clearInterval(scannerInterval);
        scannerInterval = null;
        showDebug('Scanner interval cleared');
      }
      
      if (fpsInterval) {
        clearInterval(fpsInterval);
        fpsInterval = null;
      }
      
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        showDebug('Camera stream stopped');
      }
      
      scannerContainer.style.display = 'none';
      scannerFeedback.style.display = 'none';
      scannerPerformance.style.display = 'none';
      isScanning = false;
      scannerVideo.srcObject = null;
      showDebug('Scanner stopped');
    }
    
    // Handle barcode scan
    async function handleBarcodeScan(barcode) {
      try {
        showDebug(`Looking up product for barcode: ${barcode}`);
        const product = await getProductByBarcode(barcode);
        
        if (product) {
          showProduct(product);
        } else {
          showNotFound();
        }
        
        stopScanner();
      } catch (error) {
        console.error('Barcode lookup failed:', error);
        showDebug('Barcode lookup failed: ' + error.message);
        showError('Failed to lookup product: ' + error.message);
        stopScanner();
      }
    }
    
    // Check online status
    function updateOnlineStatus() {
      if (navigator.onLine) {
        offlineBanner.style.display = 'none';
        showDebug('Online');
      } else {
        offlineBanner.style.display = 'block';
        showDebug('Offline');
      }
    }
    
    // Initialize the app
    async function initApp() {
      try {
        showDebug('Initializing application');
        await initDB();
        
        // Load last sync time
        const lastSync = localStorage.getItem('lastSync');
        if (lastSync) {
          syncStatus.textContent = `Last sync: ${lastSync}`;
          showDebug(`Last sync: ${lastSync}`);
        }
        
        // Check if we have any products in IndexedDB
        const products = await getAllProductsFromDB();
        if (products.length === 0 && navigator.onLine) {
          showDebug('No products in IndexedDB, starting sync');
          await syncProducts();
        } else if (products.length > 0) {
          showDebug(`Found ${products.length} products in IndexedDB`);
        }
        
        // Set up event listeners
        searchInput.addEventListener('input', async (e) => {
          const query = e.target.value.trim();
          
          if (query.length < 2) {
            searchResults.style.display = 'none';
            return;
          }
          
          try {
            const results = await searchProductsByName(query);
            
            searchResults.innerHTML = '';
            
            if (results.length > 0) {
              results.forEach(product => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `
                  <div class="search-item-name">${product.name}</div>
                  <div class="search-item-price">$${product.price.toFixed(2)}</div>
                `;
                
                item.addEventListener('click', () => {
                  showProduct(product);
                  searchInput.value = '';
                  searchResults.style.display = 'none';
                });
                
                searchResults.appendChild(item);
              });
              
              searchResults.style.display = 'block';
            } else {
              searchResults.style.display = 'none';
            }
          } catch (error) {
            console.error('Search failed:', error);
            showDebug('Search failed: ' + error.message);
          }
        });
        
        document.addEventListener('click', (e) => {
          if (e.target !== searchInput) {
            searchResults.style.display = 'none';
          }
        });
        
        scanBtn.addEventListener('click', () => {
          initScanner();
        });
        
        closeScanner.addEventListener('click', () => {
          stopScanner();
        });
        
        syncBtn.addEventListener('click', syncProducts);
        
        menuBtn.addEventListener('click', () => {
          loginModal.style.display = 'flex';
        });
        
        cancelLogin.addEventListener('click', () => {
          loginModal.style.display = 'none';
          loginError.textContent = '';
          loginEmail.value = '';
          loginPassword.value = '';
        });
        
        submitLogin.addEventListener('click', async () => {
          const email = loginEmail.value.trim();
          const password = loginPassword.value.trim();
          
          if (!email || !password) {
            loginError.textContent = 'Please enter both email and password';
            return;
          }
          
          try {
            submitLogin.innerHTML = '<span class="loading"></span> Logging in...';
            
            await auth.signInWithEmailAndPassword(email, password);
            
            // Redirect to admin page
            window.location.href = 'admin.html';
          } catch (error) {
            console.error('Login failed:', error);
            loginError.textContent = error.message;
            submitLogin.textContent = 'Login';
          }
        });
        
        // Debug panel controls
        debugToggle.addEventListener('click', toggleDebugPanel);
        debugClear.addEventListener('click', () => {
          debugInfo.innerHTML = '';
        });
        
        // Handle online/offline status
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
        
        // Register service worker
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('sw.js');
            showDebug('Service Worker registered');
          } catch (error) {
            console.error('Service Worker registration failed:', error);
            showDebug('Service Worker registration failed: ' + error.message);
          }
        }
      } catch (error) {
        console.error('App initialization failed:', error);
        showDebug('App initialization failed: ' + error.message);
        showError('Failed to initialize app: ' + error.message);
      }
    }
    
    // Start the app
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
