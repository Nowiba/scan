<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Product Scanner</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
  <style>
    :root {
      --primary-color: #4285f4;
      --secondary-color: #34a853;
      --error-color: #ea4335;
      --text-color: #333;
      --light-gray: #f5f5f5;
      --dark-gray: #757575;
      --shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    body {
      background-color: #f9f9f9;
      color: var(--text-color);
      line-height: 1.6;
      padding: 0;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .container {
      max-width: 100%;
      padding: 15px;
      margin: 0 auto;
    }
    
    header {
      position: sticky;
      top: 0;
      background-color: white;
      padding: 10px 15px;
      box-shadow: var(--shadow);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--primary-color);
    }
    
    .search-container {
      flex-grow: 1;
      margin: 0 15px;
      position: relative;
    }
    
    #search-input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }
    
    #search-input:focus {
      border-color: var(--primary-color);
    }
    
    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: white;
      border-radius: 0 0 10px 10px;
      box-shadow: var(--shadow);
      max-height: 300px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    
    .search-item {
      padding: 10px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    
    .search-item:hover {
      background-color: var(--light-gray);
    }
    
    .search-item-name {
      font-weight: bold;
    }
    
    .search-item-price {
      color: var(--secondary-color);
      font-size: 0.9rem;
    }
    
    .menu-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-color);
    }
    
    .main-content {
      padding: 20px 0;
    }
    
    .section-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--dark-gray);
    }
    
    .btn {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.3s;
      margin: 5px 0;
      width: 100%;
    }
    
    .btn:hover {
      background-color: #3367d6;
    }
    
    .btn-secondary {
      background-color: var(--secondary-color);
    }
    
    .btn-secondary:hover {
      background-color: #2d9249;
    }
    
    .btn-danger {
      background-color: var(--error-color);
    }
    
    .btn-danger:hover {
      background-color: #d33426;
    }
    
    .scanner-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: black;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    
    #scanner-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(1);
    }
    
    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    
    .scanner-frame {
      width: 90%;
      max-width: 500px;
      height: 200px;
      border: 4px solid #00ff88;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }
    
    .scan-line {
      position: absolute;
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, transparent, #00ff88, transparent);
      box-shadow: 0 0 10px #00ff88;
      top: 0;
      animation: scan 2s ease-in-out infinite;
    }
    
    @keyframes scan {
      0% { top: 0; }
      50% { top: calc(100% - 4px); }
      100% { top: 0; }
    }
    
    .scanner-guide {
      margin-top: 15px;
      color: white;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
      font-size: 1.2rem;
    }
    
    .scanner-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    
    .scanner-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
    
    .product-display {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: var(--shadow);
      display: none;
    }
    
    .product-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .product-price {
      font-size: 1.8rem;
      color: var(--secondary-color);
      font-weight: bold;
    }
    
    .product-barcode {
      color: var(--dark-gray);
      font-size: 0.9rem;
      margin-top: 10px;
    }
    
    .sync-status {
      font-size: 0.9rem;
      color: var(--dark-gray);
      margin-top: 20px;
      text-align: center;
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    
    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    
    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--primary-color);
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }
    
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }
    
    .error-message {
      color: var(--error-color);
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .not-found {
      text-align: center;
      padding: 20px;
      color: var(--error-color);
      display: none;
    }
    
    .offline-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #ff9800;
      color: white;
      padding: 10px;
      text-align: center;
      display: none;
      z-index: 100;
    }
    
    .debug-panel-container {
      position: fixed;
      top: 60px;
      right: 10px;
      z-index: 2000;
    }
    
    .debug-toggle {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }
    
    .debug-panel {
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      width: 300px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
      font-size: 0.8rem;
      box-shadow: var(--shadow);
    }
    
    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .debug-title {
      font-weight: bold;
    }
    
    .debug-clear {
      background: #444;
      border: none;
      color: white;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .debug-info {
      line-height: 1.5;
    }
    
    .debug-entry {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }
    
    .debug-timestamp {
      color: #aaa;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    
    .debug-message {
      word-wrap: break-word;
    }
    
    .scanner-feedback {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: none;
      z-index: 10;
    }
    
    .scanner-performance {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: none;
      z-index: 10;
    }
    
    .db-indicator {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: none;
      z-index: 10;
    }
    
    @media (min-width: 768px) {
      .container {
        max-width: 750px;
      }
      
      .btn {
        width: auto;
      }
      
      .scanner-frame {
        width: 60%;
        height: 250px;
      }
      
      .debug-panel {
        width: 400px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ProductScan</div>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search products...">
      <div id="search-results"></div>
    </div>
    <button class="menu-btn" id="menu-btn">☰</button>
  </header>
  
  <div class="container">
    <div class="main-content">
      <button id="scan-btn" class="btn btn-secondary">📷 Scan Barcode</button>
      <button id="sync-btn" class="btn">🔄 Sync Now</button>
      
      <div class="scanner-container" id="scanner-container">
        <div class="scanner-feedback" id="scanner-feedback">Scanning...</div>
        <div class="scanner-performance" id="scanner-performance">FPS: 0 | Quality: High</div>
        <div class="db-indicator" id="db-indicator">Using: IndexedDB</div>
        <video id="scanner-video" playsinline autoplay></video>
        <div class="scanner-overlay">
          <div class="scanner-frame">
            <div class="scan-line"></div>
          </div>
          <div class="scanner-guide">Point camera at barcode</div>
        </div>
        <div class="scanner-controls">
          <button class="scanner-btn" id="close-scanner">✕</button>
        </div>
      </div>
      
      <div class="product-display" id="product-display">
        <div class="product-name" id="product-name"></div>
        <div class="product-price" id="product-price"></div>
        <div class="product-barcode" id="product-barcode"></div>
        <div class="product-source" id="product-source"></div>
      </div>
      
      <div class="not-found" id="not-found">
        Product not found in database
      </div>
      
      <div class="sync-status" id="sync-status">
        Last sync: Never
      </div>
    </div>
  </div>
  
  <div class="debug-panel-container">
    <button class="debug-toggle" id="debug-toggle">Debug Mode</button>
    <div class="debug-panel" id="debug-panel">
      <div class="debug-header">
        <div class="debug-title">Debug Information</div>
        <button class="debug-clear" id="debug-clear">Clear</button>
      </div>
      <div class="debug-info" id="debug-info"></div>
    </div>
  </div>
  
  <div class="offline-banner" id="offline-banner">
    You are currently offline. Some features may be limited.
  </div>
  
  <div class="modal" id="login-modal">
    <div class="modal-content">
      <div class="modal-title">Admin Login</div>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Password">
      </div>
      <div class="error-message" id="login-error"></div>
      <div class="modal-actions">
        <button id="cancel-login" class="btn btn-danger" style="margin-right: 10px;">Cancel</button>
        <button id="submit-login" class="btn">Login</button>
      </div>
    </div>
  </div>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDdjJKO4eeIWtKKUKiuT9USPF3eyFnVuSQ",
      authDomain: "scan-prod1.firebaseapp.com",
      databaseURL: "https://scan-prod1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "scan-prod1",
      storageBucket: "scan-prod1.firebasestorage.app",
      messagingSenderId: "197976973628",
      appId: "1:197976973628:web:73bdf954ae78017b813e39"
    };
    
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    
    // DOM elements
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const menuBtn = document.getElementById('menu-btn');
    const scanBtn = document.getElementById('scan-btn');
    const syncBtn = document.getElementById('sync-btn');
    const scannerContainer = document.getElementById('scanner-container');
    const scannerVideo = document.getElementById('scanner-video');
    const scannerFeedback = document.getElementById('scanner-feedback');
    const scannerPerformance = document.getElementById('scanner-performance');
    const dbIndicator = document.getElementById('db-indicator');
    const closeScanner = document.getElementById('close-scanner');
    const productDisplay = document.getElementById('product-display');
    const productName = document.getElementById('product-name');
    const productPrice = document.getElementById('product-price');
    const productBarcode = document.getElementById('product-barcode');
    const productSource = document.getElementById('product-source');
    const notFound = document.getElementById('not-found');
    const syncStatus = document.getElementById('sync-status');
    const offlineBanner = document.getElementById('offline-banner');
    const loginModal = document.getElementById('login-modal');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginError = document.getElementById('login-error');
    const cancelLogin = document.getElementById('cancel-login');
    const submitLogin = document.getElementById('submit-login');
    const debugToggle = document.getElementById('debug-toggle');
    const debugPanel = document.getElementById('debug-panel');
    const debugInfo = document.getElementById('debug-info');
    const debugClear = document.getElementById('debug-clear');
    
    // Variables
    let isScanning = false;
    let db = null;
    let stream = null;
    let debugMode = true;
    let debugPanelVisible = false;
    let scanAttempts = 0;
    let lastScannedBarcode = null;
    let frameCount = 0;
    let fps = 0;
    let fpsInterval = 0;
    let isOnline = navigator.onLine;
    let quaggaInitialized = false;

    // Initialize IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('ProductDB', 5);
        
        request.onerror = (event) => {
          console.error('IndexedDB error:', event.target.error);
          showDebug('IndexedDB error: ' + event.target.error.message);
          reject('Failed to open database');
        };
        
        request.onsuccess = (event) => {
          db = event.target.result;
          showDebug('IndexedDB initialized successfully');
          resolve(db);
        };
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('products')) {
            const store = db.createObjectStore('products', { keyPath: 'barcode' });
            store.createIndex('name', 'name', { unique: false });
            showDebug('Created products object store');
          }
        };
      });
    }
    
    // Add product to IndexedDB
    function addProductToDB(product) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readwrite');
        const store = transaction.objectStore('products');
        const request = store.put(product);
        
        request.onsuccess = () => {
          showDebug(`Added product to IndexedDB: ${product.barcode} - ${product.name}`);
          resolve();
        }
        request.onerror = (event) => {
          showDebug('Error adding product to IndexedDB: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Get product by barcode from IndexedDB
    function getProductByBarcode(barcode) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const request = store.get(barcode);
        
        request.onsuccess = () => {
          showDebug(`Product lookup for ${barcode}: ${request.result ? 'Found' : 'Not found'}`);
          resolve(request.result);
        }
        request.onerror = (event) => {
          showDebug('Error getting product from IndexedDB: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Get product from Firebase (when online)
    function getProductFromFirebase(barcode) {
      return new Promise((resolve, reject) => {
        if (!isOnline) {
          resolve(null);
          return;
        }
        
        database.ref('products/' + barcode).once('value')
          .then(snapshot => {
            const product = snapshot.val();
            if (product) {
              // Add barcode to product data for consistency
              product.barcode = barcode;
              showDebug(`Found product in Firebase: ${barcode}`);
            } else {
              showDebug(`Product not found in Firebase: ${barcode}`);
            }
            resolve(product);
          })
          .catch(error => {
            showDebug('Firebase error: ' + error.message);
            reject(error);
          });
      });
    }
    
    // Search products by name in IndexedDB
    function searchProductsByName(query) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const index = store.index('name');
        const request = index.getAll();
        
        request.onsuccess = () => {
          const products = request.result.filter(product => 
            product.name.toLowerCase().includes(query.toLowerCase())
          );
          showDebug(`Search for "${query}" found ${products.length} products`);
          resolve(products);
        };
        
        request.onerror = (event) => {
          showDebug('Search error: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Get all products from IndexedDB
    function getAllProductsFromDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const request = store.getAll();
        
        request.onsuccess = () => {
          showDebug(`Retrieved ${request.result.length} products from IndexedDB`);
          resolve(request.result);
        };
        request.onerror = (event) => {
          showDebug('Error getting all products: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Clear all products from IndexedDB
    function clearProductsDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['products'], 'readwrite');
        const store = transaction.objectStore('products');
        const request = store.clear();
        
        request.onsuccess = () => {
          showDebug('Cleared all products from IndexedDB');
          resolve();
        }
        request.onerror = (event) => {
          showDebug('Error clearing IndexedDB: ' + event.target.error);
          reject(event.target.error);
        }
      });
    }
    
    // Sync products from Firebase to IndexedDB
    async function syncProducts() {
      try {
        if (!isOnline) {
          showDebug('Sync failed: No internet connection');
          throw new Error('No internet connection');
        }
        
        syncBtn.innerHTML = '<span class="loading"></span> Syncing...';
        showDebug('Starting product sync from Firebase');
        
        const snapshot = await database.ref('products').once('value');
        const products = snapshot.val();
        
        await clearProductsDB();
        
        if (products) {
          const productCount = Object.keys(products).length;
          showDebug(`Syncing ${productCount} products from Firebase`);
          
          const promises = Object.entries(products).map(([barcode, product]) => {
            // Ensure barcode is stored as string for consistency
            const productData = {
              ...product,
              barcode: String(barcode) // Use Firebase key as barcode
            };
            return addProductToDB(productData);
          });
          
          await Promise.all(promises);
          showDebug(`Successfully synced ${productCount} products`);
        } else {
          showDebug('No products found in Firebase');
        }
        
        const lastSync = new Date().toLocaleString();
        localStorage.setItem('lastSync', lastSync);
        syncStatus.textContent = `Last sync: ${lastSync}`;
        syncBtn.textContent = '🔄 Sync Now';
        showDebug('Sync completed successfully');
        
        return true;
      } catch (error) {
        console.error('Sync failed:', error);
        showDebug('Sync failed: ' + error.message);
        syncBtn.textContent = '🔄 Sync Now';
        showError('Sync failed. ' + error.message);
        return false;
      }
    }
    
    // Show product information
    function showProduct(product, source) {
      productName.textContent = product.name;
      productPrice.textContent = `$${product.price.toFixed(2)}`;
      productBarcode.textContent = `Barcode: ${product.barcode}`;
      productSource.textContent = `Source: ${source}`;
      productSource.style.color = source === 'Firebase' ? '#4285f4' : '#34a853';
      productDisplay.style.display = 'block';
      notFound.style.display = 'none';
      showDebug(`Displaying product from ${source}: ${product.barcode} - ${product.name}`);
    }
    
    // Show not found message
    function showNotFound() {
      productDisplay.style.display = 'none';
      notFound.style.display = 'block';
      showDebug('Product not found in any database');
    }
    
    // Show error message
    function showError(message) {
      const errorElement = document.createElement('div');
      errorElement.className = 'error-message';
      errorElement.textContent = message;
      
      const container = document.querySelector('.container');
      container.insertBefore(errorElement, container.firstChild);
      
      setTimeout(() => {
        errorElement.remove();
      }, 5000);
    }
    
    // Show debug information
    function showDebug(message) {
      if (!debugMode) return;
      
      const now = new Date();
      const timestamp = now.toLocaleTimeString() + '.' + now.getMilliseconds().toString().padStart(3, '0');
      
      const debugEntry = document.createElement('div');
      debugEntry.className = 'debug-entry';
      debugEntry.innerHTML = `
        <span class="debug-timestamp">[${timestamp}]</span>
        <span class="debug-message">${message}</span>
      `;
      
      debugInfo.appendChild(debugEntry);
      debugInfo.scrollTop = debugInfo.scrollHeight;
    }
    
    // Toggle debug panel
    function toggleDebugPanel() {
      debugPanelVisible = !debugPanelVisible;
      debugPanel.style.display = debugPanelVisible ? 'block' : 'none';
    }
    
    // Initialize barcode scanner with optimized performance
    async function initScanner() {
      try {
        // Stop any existing scanner
        if (quaggaInitialized) {
          Quagga.stop();
          Quagga.offDetected();
        }
        
        // Get camera access with optimized settings
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 60, max: 60 },
            focusMode: "continuous"
          } 
        });
        
        scannerVideo.srcObject = stream;
        scannerContainer.style.display = 'flex';
        scannerFeedback.style.display = 'block';
        scannerPerformance.style.display = 'block';
        dbIndicator.style.display = 'block';
        isScanning = true;
        scanAttempts = 0;
        
        // Start FPS counter
        frameCount = 0;
        fpsInterval = setInterval(() => {
          fps = frameCount;
          frameCount = 0;
          scannerPerformance.textContent = `FPS: ${fps} | Quality: High`;
        }, 1000);
        
        showDebug('Scanner initialized with optimized settings');
        
        // Apply the correct orientation for back camera
        scannerVideo.style.transform = 'scaleX(1)';
        
        // Initialize Quagga when video is playing
        scannerVideo.onplaying = () => {
          showDebug('Video stream started');
          
          // Initialize Quagga for barcode scanning
          Quagga.init({
            inputStream: {
              name: "Live",
              type: "LiveStream",
              target: scannerVideo,
              constraints: {
                width: 640,
                height: 480,
                facingMode: "environment"
              },
            },
            decoder: {
              readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "code_39_reader",
                "code_39_vin_reader",
                "codabar_reader",
                "upc_reader",
                "upc_e_reader",
                "i2of5_reader"
              ]
            },
            locate: true,
            frequency: 10,
            halfSample: true,
            debug: {
              drawBoundingBox: false,
              showFrequency: false,
              drawScanline: false,
              showPattern: false
            }
          }, function(err) {
            if (err) {
              showDebug("Error initializing Quagga: " + err);
              return;
            }
            
            Quagga.start();
            quaggaInitialized = true;
            showDebug("Quagga started with optimized settings");
          });
          
          Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            showDebug(`Quagga detected barcode: ${code}`);
            handleBarcodeScan(code);
          });
        };
        
      } catch (error) {
        console.error('Scanner init failed:', error);
        showDebug('Scanner init failed: ' + error.message);
        
        // Fallback to lower quality settings if needed
        if (error.name === 'OverconstrainedError') {
          showDebug('Trying fallback camera settings');
          initScannerFallback();
        } else {
          showError('Failed to initialize scanner: ' + error.message);
          if (error.name === 'NotAllowedError') {
            showError('Camera access denied. Please allow camera permissions.');
          }
          stopScanner();
        }
      }
    }
    
    // Fallback scanner with reduced quality
    async function initScannerFallback() {
      try {
        // Stop any existing scanner
        if (quaggaInitialized) {
          Quagga.stop();
          Quagga.offDetected();
        }
        
        // Get camera access with lower settings
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "environment",
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30, max: 30 },
            focusMode: "continuous"
          } 
        });
        
        scannerVideo.srcObject = stream;
        scannerContainer.style.display = 'flex';
        scannerFeedback.style.display = 'block';
        scannerPerformance.style.display = 'block';
        dbIndicator.style.display = 'block';
        isScanning = true;
        scanAttempts = 0;
        
        // Start FPS counter
        frameCount = 0;
        fpsInterval = setInterval(() => {
          fps = frameCount;
          frameCount = 0;
          scannerPerformance.textContent = `FPS: ${fps} | Quality: Medium`;
        }, 1000);
        
        showDebug('Scanner initialized with fallback settings');
        
        // Apply the correct orientation for back camera
        scannerVideo.style.transform = 'scaleX(1)';
        
        // Initialize Quagga when video is playing
        scannerVideo.onplaying = () => {
          showDebug('Video stream started with fallback settings');
          
          // Initialize Quagga for barcode scanning
          Quagga.init({
            inputStream: {
              name: "Live",
              type: "LiveStream",
              target: scannerVideo,
              constraints: {
                width: 640,
                height: 480,
                facingMode: "environment"
              },
            },
            decoder: {
              readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "code_39_reader",
                "code_39_vin_reader",
                "codabar_reader",
                "upc_reader",
                "upc_e_reader",
                "i2of5_reader"
              ]
            },
            locate: true,
            frequency: 5,
            halfSample: true,
            debug: {
              drawBoundingBox: false,
              showFrequency: false,
              drawScanline: false,
              showPattern: false
            }
          }, function(err) {
            if (err) {
              showDebug("Error initializing Quagga: " + err);
              return;
            }
            
            Quagga.start();
            quaggaInitialized = true;
            showDebug("Quagga started with fallback settings");
          });
          
          Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            showDebug(`Quagga detected barcode: ${code}`);
            handleBarcodeScan(code);
          });
        };
        
      } catch (error) {
        console.error('Fallback scanner init failed:', error);
        showDebug('Fallback scanner init failed: ' + error.message);
        showError('Failed to initialize scanner: ' + error.message);
        stopScanner();
      }
    }
    
    // Stop barcode scanner
    function stopScanner() {
      if (quaggaInitialized) {
        Quagga.stop();
        Quagga.offDetected();
        quaggaInitialized = false;
      }
      
      if (fpsInterval) {
        clearInterval(fpsInterval);
        fpsInterval = null;
      }
      
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      
      scannerContainer.style.display = 'none';
      scannerFeedback.style.display = 'none';
      scannerPerformance.style.display = 'none';
      dbIndicator.style.display = 'none';
      isScanning = false;
      scannerVideo.srcObject = null;
      showDebug('Scanner stopped');
    }
    
    // Handle barcode scan with dual database check
    async function handleBarcodeScan(barcode) {
      try {
        showDebug(`Looking up product for barcode: ${barcode}`);
        let product = null;
        let source = '';
        
        // Update database indicator
        dbIndicator.textContent = isOnline ? 'Using: Firebase' : 'Using: IndexedDB';
        dbIndicator.style.background = isOnline ? '#4285f4' : '#34a853';
        
        // Always check IndexedDB first
        product = await getProductByBarcode(barcode);
        if (product) {
          source = 'IndexedDB';
          showProduct(product, source);
          stopScanner();
          return;
        }
        
        // If online, check Firebase
        if (isOnline) {
          product = await getProductFromFirebase(barcode);
          if (product) {
            source = 'Firebase';
            // Add to IndexedDB for future offline access
            await addProductToDB(product);
            showProduct(product, source);
            stopScanner();
            return;
          }
        }
        
        // If not found in either database
        showNotFound();
        stopScanner();
        
      } catch (error) {
        console.error('Barcode lookup failed:', error);
        showDebug('Barcode lookup failed: ' + error.message);
        showError('Failed to lookup product: ' + error.message);
        stopScanner();
      }
    }
    
    // Check online status
    function updateOnlineStatus() {
      isOnline = navigator.onLine;
      if (isOnline) {
        offlineBanner.style.display = 'none';
        showDebug('Online - Using Firebase when available');
      } else {
        offlineBanner.style.display = 'block';
        showDebug('Offline - Using IndexedDB');
      }
    }
    
    // Initialize the app
    async function initApp() {
      try {
        showDebug('Initializing application');
        await initDB();
        
        // Load last sync time
        const lastSync = localStorage.getItem('lastSync');
        if (lastSync) {
          syncStatus.textContent = `Last sync: ${lastSync}`;
          showDebug(`Last sync: ${lastSync}`);
        }
        
        // Check if we have any products in IndexedDB
        const products = await getAllProductsFromDB();
        if (products.length === 0 && isOnline) {
          showDebug('No products in IndexedDB, starting sync');
          await syncProducts();
        } else if (products.length > 0) {
          showDebug(`Found ${products.length} products in IndexedDB`);
        }
        
        // Set up event listeners
        searchInput.addEventListener('input', async (e) => {
          const query = e.target.value.trim();
          
          if (query.length < 2) {
            searchResults.style.display = 'none';
            return;
          }
          
          try {
            const results = await searchProductsByName(query);
            
            searchResults.innerHTML = '';
            
            if (results.length > 0) {
              results.forEach(product => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `
                  <div class="search-item-name">${product.name}</div>
                  <div class="search-item-price">$${product.price.toFixed(2)}</div>
                `;
                
                item.addEventListener('click', () => {
                  showProduct(product, 'IndexedDB');
                  searchInput.value = '';
                  searchResults.style.display = 'none';
                });
                
                searchResults.appendChild(item);
              });
              
              searchResults.style.display = 'block';
            } else {
              searchResults.style.display = 'none';
            }
          } catch (error) {
            console.error('Search failed:', error);
            showDebug('Search failed: ' + error.message);
          }
        });
        
        document.addEventListener('click', (e) => {
          if (e.target !== searchInput) {
            searchResults.style.display = 'none';
          }
        });
        
        scanBtn.addEventListener('click', () => {
          initScanner();
        });
        
        closeScanner.addEventListener('click', () => {
          stopScanner();
        });
        
        syncBtn.addEventListener('click', syncProducts);
        
        menuBtn.addEventListener('click', () => {
          loginModal.style.display = 'flex';
        });
        
        cancelLogin.addEventListener('click', () => {
          loginModal.style.display = 'none';
          loginError.textContent = '';
          loginEmail.value = '';
          loginPassword.value = '';
        });
        
        submitLogin.addEventListener('click', async () => {
          const email = loginEmail.value.trim();
          const password = loginPassword.value.trim();
          
          if (!email || !password) {
            loginError.textContent = 'Please enter both email and password';
            return;
          }
          
          try {
            submitLogin.innerHTML = '<span class="loading"></span> Logging in...';
            
            await auth.signInWithEmailAndPassword(email, password);
            
            // Redirect to admin page
            window.location.href = 'admin.html';
          } catch (error) {
            console.error('Login failed:', error);
            loginError.textContent = error.message;
            submitLogin.textContent = 'Login';
          }
        });
        
        // Debug panel controls
        debugToggle.addEventListener('click', toggleDebugPanel);
        debugClear.addEventListener('click', () => {
          debugInfo.innerHTML = '';
        });
        
        // Handle online/offline status
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
        
        // Register service worker
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('sw.js');
            showDebug('Service Worker registered');
          } catch (error) {
            console.error('Service Worker registration failed:', error);
            showDebug('Service Worker registration failed: ' + error.message);
          }
        }
      } catch (error) {
        console.error('App initialization failed:', error);
        showDebug('App initialization failed: ' + error.message);
        showError('Failed to initialize app: ' + error.message);
      }
    }
    
    // Start the app
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
