<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <title>Admin - Product Scanner PWA</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="https://via.placeholder.com/192x192.png?text=App+Icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"></script>
  <style>
    body { background: linear-gradient(to bottom, #1e40af, #3b82f6); min-height: 100vh; }
    .toast { transition: all 0.3s ease-in-out; transform: translateY(-100px); opacity: 0; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .form-container { transition: all 0.3s ease; }
    .form-container:hover { transform: scale(1.02); }
  </style>
</head>
<body class="flex flex-col items-center text-white font-sans">
  <div id="toast" class="toast fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50"></div>
  <div id="loading" class="flex flex-col items-center justify-center h-screen">
    <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-500"></div>
    <p class="mt-4 text-lg">Loading...</p>
  </div>
  <div id="adminContent" class="hidden w-11/12 max-w-lg mt-16">
    <h1 class="text-3xl font-bold mb-6 text-center">Admin Panel</h1>
    <div class="form-container bg-white text-gray-800 p-6 rounded-lg shadow-lg">
      <h2 class="text-xl font-semibold mb-4">Add/Edit Product</h2>
      <input id="barcode" type="text" placeholder="Barcode" class="w-full p-2 mb-4 border rounded">
      <input id="name" type="text" placeholder="Product Name" class="w-full p-2 mb-4 border rounded">
      <input id="price" type="number" step="0.01" placeholder="Price" class="w-full p-2 mb-4 border rounded">
      <button id="saveBtn" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Save Product</button>
    </div>
    <button id="logoutBtn" class="mt-6 w-full bg-red-600 text-white p-2 rounded hover:bg-red-700 transition">Logout</button>
  </div>
  <script>
    function showToast(message, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Retry Firebase loading with timeout
    function waitForFirebase(maxAttempts = 5, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (typeof firebase !== 'undefined') {
            clearInterval(interval);
            console.log('Firebase SDK loaded');
            resolve(firebase);
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            console.error('Firebase SDK failed to load after', maxAttempts, 'attempts');
            reject(new Error('Firebase SDK not loaded'));
          }
        }, delay);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Wait for Firebase to load
        await waitForFirebase();
      } catch (error) {
        showToast('Failed to load Firebase. Check your network or try again.');
        console.error(error.message);
        return;
      }

      const firebaseConfig = {
        apiKey: "AIzaSyDdjJKO4eeIWtKKUKiuT9USPF3eyFnVuSQ",
        authDomain: "scan-prod1.firebaseapp.com",
        databaseURL: "https://scan-prod1-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "scan-prod1",
        storageBucket: "scan-prod1.appspot.com",
        messagingSenderId: "197976973628",
        appId: "1:197976973628:web:73bdf954ae78017b813e39"
      };

      try {
        firebase.initializeApp(firebaseConfig);
        console.log('Firebase initialized successfully');
      } catch (error) {
        console.error('Firebase initialization failed:', error);
        showToast('Firebase initialization error: ' + error.message);
        return;
      }

      const auth = firebase.auth();
      const db = firebase.database();

      auth.onAuthStateChanged(user => {
        const loading = document.getElementById('loading');
        const adminContent = document.getElementById('adminContent');
        try {
          if (user) {
            loading.classList.add('hidden');
            adminContent.classList.remove('hidden');
            console.log('User authenticated:', user.uid);
          } else {
            console.log('No user, redirecting to index.html');
            window.location.href = 'index.html';
          }
        } catch (error) {
          console.error('Auth state error:', error);
          showToast('Authentication error: ' + error.message);
        }
      });

      document.getElementById('saveBtn').addEventListener('click', async () => {
        const barcode = document.getElementById('barcode').value.trim();
        const name = document.getElementById('name').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        if (!barcode || !name || isNaN(price) || price < 0) {
          showToast('Please fill all fields correctly.');
          return;
        }
        try {
          await db.ref(`products/${barcode}`).set({
            barcode,
            name,
            price
          });
          showToast('Product saved successfully!');
          document.getElementById('barcode').value = '';
          document.getElementById('name').value = '';
          document.getElementById('price').value = '';
          console.log('Product saved:', { barcode, name, price });
        } catch (error) {
          console.error('Save product error:', error);
          showToast('Failed to save product: ' + error.message);
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
          await auth.signOut();
          showToast('Logged out successfully!');
          window.location.href = 'index.html';
          console.log('User logged out');
        } catch (error) {
          console.error('Logout error:', error);
          showToast('Logout failed: ' + error.message);
        }
      });
    });

    // Service Worker registration with cache clearing
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (const registration of registrations) {
          registration.unregister().then(() => {
            console.log('Old Service Worker unregistered');
          });
        }
      }).catch(error => {
        console.error('Error unregistering old Service Workers:', error);
      });

      navigator.serviceWorker.register('./sw.js').then(registration => {
        console.log('Service Worker registered with scope:', registration.scope);
      }).catch(error => {
        console.error('Service Worker registration failed:', error);
        showToast('Service Worker registration failed: ' + error.message);
      });
    }
  </script>
</body>
</html>
