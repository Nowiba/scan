<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    :root {
      --primary-color: #4285f4;
      --secondary-color: #34a853;
      --error-color: #ea4335;
      --text-color: #333;
      --light-gray: #f5f5f5;
      --dark-gray: #757575;
      --shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    body {
      background-color: #f9f9f9;
      color: var(--text-color);
      line-height: 1.6;
      padding: 0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    
    .logo {
      font-weight: bold;
      font-size: 1.3rem;
    }
    
    .card {
      background-color: white;
      border-radius: 10px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .card-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--primary-color);
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark-gray);
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      transition: border 0.3s;
    }
    
    .form-group input:focus {
      border-color: var(--primary-color);
      outline: none;
    }
    
    .btn {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.3s;
      width: 100%;
    }
    
    .btn:hover {
      background-color: #3367d6;
    }
    
    .btn-secondary {
      background-color: var(--secondary-color);
    }
    
    .btn-secondary:hover {
      background-color: #2d9249;
    }
    
    .btn-danger {
      background-color: var(--error-color);
    }
    
    .btn-danger:hover {
      background-color: #d33426;
    }
    
    .error-message {
      color: var(--error-color);
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
    }
    
    .success-message {
      color: var(--secondary-color);
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .logout-container {
      margin-top: auto;
      padding-top: 20px;
    }
    
    .hidden {
      display: none !important;
    }
    
    @media (min-width: 768px) {
      .container {
        padding: 40px 20px;
      }
      
      .card {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ProductScan Admin</div>
  </header>
  
  <div class="container">
    <!-- Login Form -->
    <div class="card" id="login-card">
      <h2 class="card-title">Admin Login</h2>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Password">
      </div>
      <div class="error-message" id="login-error"></div>
      <button id="login-btn" class="btn">Login</button>
    </div>
    
    <!-- Admin Dashboard -->
    <div class="card hidden" id="dashboard-card">
      <h2 class="card-title">Product Management</h2>
      <div class="form-group">
        <label for="product-name">Product Name</label>
        <input type="text" id="product-name" placeholder="Enter product name">
      </div>
      <div class="form-group">
        <label for="product-price">Price ($)</label>
        <input type="number" id="product-price" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label for="product-barcode">Barcode</label>
        <input type="text" id="product-barcode" placeholder="Enter barcode">
      </div>
      <div class="error-message" id="save-error"></div>
      <div class="success-message" id="save-success"></div>
      <button id="save-btn" class="btn btn-secondary">Save Product</button>
      <div class="logout-container">
        <button id="logout-btn" class="btn btn-danger">Logout</button>
      </div>
    </div>
  </div>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDdjJKO4eeIWtKKUKiuT9USPF3eyFnVuSQ",
      authDomain: "scan-prod1.firebaseapp.com",
      databaseURL: "https://scan-prod1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "scan-prod1",
      storageBucket: "scan-prod1.firebasestorage.app",
      messagingSenderId: "197976973628",
      appId: "1:197976973628:web:73bdf954ae78017b813e39"
    };
    
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    
    // DOM elements
    const loginCard = document.getElementById('login-card');
    const dashboardCard = document.getElementById('dashboard-card');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');
    const productName = document.getElementById('product-name');
    const productPrice = document.getElementById('product-price');
    const productBarcode = document.getElementById('product-barcode');
    const saveError = document.getElementById('save-error');
    const saveSuccess = document.getElementById('save-success');
    const saveBtn = document.getElementById('save-btn');
    const logoutBtn = document.getElementById('logout-btn');
    
    // Initialize the app
    function initApp() {
      // Check auth state
      auth.onAuthStateChanged(user => {
        if (user) {
          // User is signed in
          showDashboard();
        } else {
          // No user is signed in
          showLogin();
        }
      });
      
      // Set up event listeners
      loginBtn.addEventListener('click', handleLogin);
      saveBtn.addEventListener('click', handleSaveProduct);
      logoutBtn.addEventListener('click', handleLogout);
      
      // Allow form submission with Enter key
      loginPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleLogin();
        }
      });
      
      productBarcode.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleSaveProduct();
        }
      });
    }
    
    // Show login form
    function showLogin() {
      loginCard.classList.remove('hidden');
      dashboardCard.classList.add('hidden');
      loginEmail.value = '';
      loginPassword.value = '';
      loginError.textContent = '';
    }
    
    // Show dashboard
    function showDashboard() {
      loginCard.classList.add('hidden');
      dashboardCard.classList.remove('hidden');
      productName.value = '';
      productPrice.value = '';
      productBarcode.value = '';
      saveError.textContent = '';
      saveSuccess.textContent = '';
    }
    
    // Handle login
    async function handleLogin() {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      
      if (!email || !password) {
        loginError.textContent = 'Please enter both email and password';
        return;
      }
      
      try {
        loginBtn.innerHTML = '<span class="loading"></span> Logging in...';
        loginError.textContent = '';
        
        await auth.signInWithEmailAndPassword(email, password);
        
        // Success - auth state change will handle the UI update
      } catch (error) {
        console.error('Login error:', error);
        loginError.textContent = error.message;
        loginBtn.textContent = 'Login';
      }
    }
    
    // Handle product save
    async function handleSaveProduct() {
      const name = productName.value.trim();
      const price = parseFloat(productPrice.value);
      const barcode = productBarcode.value.trim();
      
      // Validation
      if (!name) {
        saveError.textContent = 'Please enter a product name';
        return;
      }
      
      if (isNaN(price) || price <= 0) {
        saveError.textContent = 'Please enter a valid price';
        return;
      }
      
      if (!barcode) {
        saveError.textContent = 'Please enter a barcode';
        return;
      }
      
      try {
        saveBtn.innerHTML = '<span class="loading"></span> Saving...';
        saveError.textContent = '';
        saveSuccess.textContent = '';
        
        // Save to Firebase
        const productRef = database.ref(`products/${barcode}`);
        await productRef.set({
          name,
          price,
          barcode
        });
        
        // Show success message
        saveSuccess.textContent = 'Product saved successfully!';
        
        // Clear form (except barcode for quick edits)
        productName.value = '';
        productPrice.value = '';
        productName.focus();
        
        saveBtn.textContent = 'Save Product';
      } catch (error) {
        console.error('Save error:', error);
        saveError.textContent = 'Failed to save product: ' + error.message;
        saveBtn.textContent = 'Save Product';
      }
    }
    
    // Handle logout
    async function handleLogout() {
      try {
        await auth.signOut();
        // Auth state change will handle the UI update
      } catch (error) {
        console.error('Logout error:', error);
        saveError.textContent = 'Failed to logout: ' + error.message;
      }
    }
    
    // Start the app
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
